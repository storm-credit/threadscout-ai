name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Design authority documents present
        run: npm run check:docs
      - name: Unit and acceptance tests
        run: npm test
      - name: Deterministic slice pipeline
        run: npm run slice1:pipeline
      - name: Fixture research stays offline
        run: npm run research:fixture
      - name: Live sources remain disabled
        run: npm run research:readiness
